name: Mobile Build

on:
  push:
    branches: [main]
    paths-ignore:
      - backend/**
      - docs/**
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform android --profile preview --non-interactive --wait
