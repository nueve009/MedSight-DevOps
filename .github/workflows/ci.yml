name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  secret-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - run: |
          if [ -n "$PRACTICE_SECRET" ]; then echo "secret is available"; else echo "secret is missing"; exit 1; fi
        env:
          PRACTICE_SECRET: ${{ secrets.PRACTICE_SECRET }}
