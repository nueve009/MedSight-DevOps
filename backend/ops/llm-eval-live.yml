# Live LLM evaluation against the real model. Copy to
# .github/workflows/llm-eval-live.yml (see ops/README.md).
#
# Runs the cases in backend/kb/eval/llm_cases.jsonl with real Groq calls
# (about 25 calls a run), skipping the offline-only ones. Not a required
# check and not run on pull requests, because the Groq free tier is shared
# with the deployed app. Fails only on a critical result: a reviewed answer
# for the wrong medicine, a missing warning, or dosing advice.
name: LLM eval (live)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1" # Mondays 02:00 Philippine time

permissions:
  contents: read

concurrency:
  group: llm-eval-live
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging # GROQ_API_KEY lives here, as an environment secret
    env:
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run the cases against Groq
        run: python -m scripts.eval_llm --mode live --out llm-eval-live.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-live
          path: backend/llm-eval-live.json
          if-no-files-found: ignore
