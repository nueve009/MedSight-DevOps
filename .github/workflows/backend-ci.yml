# Backend CI. Copy to .github/workflows/backend-ci.yml (see ops/README.md).
# Runs lint, tests, the kb/ check and a dependency audit for every PR that
# touches backend/, plus a secret scan of the whole repo.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Validate kb/
        # Remove --allow-empty once the team's first rows are merged, so an
        # empty or broken dataset fails CI.
        run: python -m scripts.kb_build --check --allow-empty
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the full history, not only the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repos owned by a GitHub organization also need GITLEAKS_LICENSE
          # (free key from gitleaks.io). Personal-account repos don't.
